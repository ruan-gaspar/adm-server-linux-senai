<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crefisa | Página de Teste</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:

                radial-gradient(
                    circle at top left,
                    #00a7b5,
                    transparent 40%
                ),

                radial-gradient(
                    circle at bottom right,
                    #003b70,
                    transparent 45%
                ),

                linear-gradient(
                    135deg,
                    #e9fbff,
                    #ffffff
                );

            color: #123;

        }


        .container {

            width: min(900px, 90%);

            padding: 55px 45px;

            text-align: center;

            background:
                rgba(255,255,255,0.94);

            border-radius: 28px;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.18);

            border:
                1px solid
                rgba(255,255,255,0.8);

        }


        .logo {

            width: 300px;

            max-width: 80%;

            margin-bottom: 30px;

        }


        h1 {

            font-size: 42px;

            margin-bottom: 15px;

            color: #003b70;

        }


        .subtitle {

            font-size: 22px;

            color: #008c9e;

            margin-bottom: 35px;

        }


        .info {

            display: grid;

            gap: 18px;

            margin-top: 25px;

        }


        .card {

            padding: 20px;

            border-radius: 15px;

            background: #f4fbfd;

            border-left:
                5px solid #00a7b5;

        }


        .label {

            font-size: 13px;

            text-transform: uppercase;

            letter-spacing: 1px;

            color: #607d8b;

            margin-bottom: 6px;

        }


        .value {

            font-size: 19px;

            font-weight: bold;

            color: #003b70;

        }


        .status {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-top: 25px;

            padding: 10px 18px;

            border-radius: 50px;

            background: #e7f8ef;

            color: #16794c;

            font-weight: bold;

        }


        .dot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: #21a366;

        }


        footer {

            margin-top: 35px;

            font-size: 14px;

            color: #78909c;

        }


        @media (max-width: 600px) {

            .container {

                padding: 35px 20px;

            }


            h1 {

                font-size: 32px;

            }


            .subtitle {

                font-size: 18px;

            }

        }

    </style>

</head>


<body>


    <main class="container">


        <!-- =================================================
             LOGO CREFISA
             ================================================= -->

        <svg class="logo"
             viewBox="0 0 500 193"
             xmlns="http://www.w3.org/2000/svg"
             role="img"
             aria-label="Crefisa">


            <defs>

                <linearGradient
                    id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop
                        offset="0%"
                        stop-color="#00a7b5"/>

                    <stop
                        offset="100%"
                        stop-color="#00649b"/>

                </linearGradient>

            </defs>


            <rect
                x="0"
                y="0"
                width="500"
                height="193"
                rx="30"
                fill="url(#bg)"
            />


            <circle
                cx="390"
                cy="62"
                r="22"
                fill="#f5b400"
            />


            <g
                stroke="#f5b400"
                stroke-width="7"
                stroke-linecap="round">

                <line
                    x1="390"
                    y1="27"
                    x2="390"
                    y2="15"/>

                <line
                    x1="390"
                    y1="99"
                    x2="390"
                    y2="111"/>

                <line
                    x1="355"
                    y1="62"
                    x2="343"
                    y2="62"/>

                <line
                    x1="425"
                    y1="62"
                    x2="437"
                    y2="62"/>

            </g>


            <text
                x="250"
                y="125"
                text-anchor="middle"
                font-family="Arial, Helvetica, sans-serif"
                font-size="85"
                font-weight="bold"
                font-style="italic"
                fill="white">

                crefisa

            </text>

        </svg>


        <h1>
            Página de Teste
        </h1>


        <p class="subtitle">
            Servidor Apache funcionando corretamente
        </p>


        <section class="info">


            <div class="card">

                <div class="label">
                    Curso
                </div>

                <div class="value">
                    Administrador de Servidores Linux
                </div>

            </div>


            <div class="card">

                <div class="label">
                    Instituição
                </div>

                <div class="value">
                    Senai Professor Vicente Amato<br>
                    Jandira/SP
                </div>

            </div>


            <div class="card">

                <div class="label">
                    Professor responsável
                </div>

                <div class="value">
                    André Bagnoli
                </div>

            </div>


        </section>


        <div class="status">

            <span class="dot"></span>

            Servidor online

        </div>


        <footer>

            Laboratório de Integração de Serviços Linux

        </footer>


    </main>


</body>

</html>
